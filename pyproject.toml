[project]
name = "ppp-2026"
version = "0.1.0"
description = "Programming and Problem Solving with Python, DHBW Mannheim 2026"
readme = "README.md"
requires-python = ">=3.14"
# Libraries needed for later exercises (matplotlib, pandas, ...) are added here
# in the week they are introduced; `uv sync` then installs them.
dependencies = [
    "fastapi[standard]>=0.165.0",
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# A plain `uv run pytest` only runs the setup check in tests/.
# Run your own exercise with `uv run pytest students/<github-login>/ex01`.
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberately small beginner set (pyflakes + syntax-level pycodestyle errors), pinned so CI
# does not change when ruff's defaults change.
select = [
    "E4", "E7", "E9", "F",
    "B006",  # mutable default argument, e.g. `def f(memo={})` (week 3)
    "E722",  # bare `except:`
    "S110",  # `except: pass` / `except Exception: pass` silently swallows errors
    "S112",  # the same with `continue`
    "T100",  # leftover `breakpoint()` / pdb call
    "W605",  # invalid escape sequence like "\d" in a normal string
]

[tool.ruff.lint.per-file-ignores]
# lecture notebooks show some errors on purpose, e.g. a NameError for a "predict" question
# or the mutable default in notebook 05
"lectures/*.ipynb" = ["B006", "F811", "F821", "F823", "F841"]
